    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <script>
      // Per-host favicon: LeadTrap on leadtrap.com, Carelu elsewhere. The SPA
      // shares one static index.html across both domains, so swap the icon by host.
      if (/(^|\.)leadtrap\.com$/i.test(location.hostname)) {
        var _ic = document.querySelector('link[rel="icon"]');
        if (_ic) { _ic.type = 'image/x-icon'; _ic.href = '/leadtrap-favicon.ico'; }
        document.title = 'LeadTrap — Agentic infrastructure for growth';
        // The static head below is Carelu-branded (JSON-LD + OG/Twitter tags).
        // That's the wrong entity on leadtrap.com and, while Carelu is in stealth,
        // a leak — strip the Carelu structured data and every Carelu-branded meta
        // once the head has parsed (useSeo re-adds LeadTrap title/desc/url/canonical).
        document.addEventListener('DOMContentLoaded', function () {
          document.querySelectorAll('script[type="application/ld+json"]').forEach(function (s) { s.remove(); });
          document.querySelectorAll('meta').forEach(function (m) {
            if (/carelu/i.test(m.getAttribute('content') || '')) m.remove();
          });
        });
      }
    </script>

          "url": "https://carelu.com/",
          "name": "Carelu",
          "publisher": { "@id": "https://carelu.com/#organization" }

        {
          "@type": "SoftwareApplication",
          "name": "Carelu",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "url": "https://carelu.com/",
          "description": "AI intake and lead-response platform for ABA therapy and behavioral-health providers. Carelu answers every family across phone, chat, form, and text, completes intake, and verifies insurance — so providers admit more families with the same team.",

            "@type": "Audience",
            "audienceType": "ABA therapy and behavioral-health providers"
          },
          "offers": {
            "@type": "Offer",
            "availability": "https://schema.org/InStock"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How do I stop losing ABA families to slow intake?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Respond to every inquiry the moment it arrives — across every channel, day and night — and complete intake before a competitor does. Carelu automates that first response and the full intake so no family waits, admitting more families without adding front-desk staff."

            },
            {
              "@type": "Question",
              "name": "How does an AI intake agent work for ABA therapy?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "It answers calls, chats, forms, and texts; collects the family's information and documents; verifies insurance eligibility; schedules the first appointment; and routes anything needing a human to your team — with a full record on every family."

            },
            {
              "@type": "Question",
              "name": "Is Carelu HIPAA compliant?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Carelu is HIPAA compliant and SOC 2 Type II, and signs a BAA with every provider."
              }
            }
          ]
        }
      ]
    }

          var analytics = stored.choice === 'all' || (stored.categories && stored.categories.analytics);

            ad_storage: marketing ? 'granted' : 'denied',
            ad_user_data: marketing ? 'granted' : 'denied',
            ad_personalization: marketing ? 'granted' : 'denied',
            analytics_storage: analytics ? 'granted' : 'denied'
